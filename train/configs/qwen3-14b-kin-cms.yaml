# Kinyarwanda CMS continued pre-training on Qwen3-14B-Base.
# AfriqueLLM trained this size on 16 nodes x 4 H100s (64 GPUs).
# Same 4,194,304-token global batch on one 8x 80GB machine:
# 8 x batch 1 x accumulation 32 x 16,384.
# If batch 1 runs out of memory, use 32 GPUs with accumulation 8.
# On H100, override flash_attn=fa3.

model_name_or_path: Qwen/Qwen3-14B-Base
template: empty

stage: pt
packing: true
do_train: true
finetuning_type: full
deepspeed: train/deepspeed/ds_z2_config.json
flash_attn: fa2
enable_liger_kernel: true
gradient_checkpointing: true

dataset_dir: data/mixture
dataset: kin_mono,kin_gazette,kin_health,eng_replay,fra_replay,finemath,cornstack,kin_synthetic
cutoff_len: 16384
overwrite_cache: false
preprocessing_num_workers: 8
dataloader_num_workers: 8

output_dir: outputs/qwen3-14b-kin-cms
logging_steps: 10
save_steps: 1000
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none
data_shared_file_system: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.01
warmup_ratio: 0.001
bf16: true
ddp_timeout: 180000000
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
